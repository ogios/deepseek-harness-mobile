name: Release APK

'on':
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # The legacy `tools` package is no longer published. Asking for it makes
          # current hosted runners fail before Gradle starts.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            test -s "$RUNNER_TEMP/release.keystore"
            echo "DSH_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "DSH_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "DSH_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "DSH_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "Release signing secrets are not all set. The committed fork keystore will sign this APK."
          fi

      # The tag is the single source of the shipped version; see app/build.gradle.kts.
      - name: Derive version from tag
        run: |
          echo "DSH_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "DSH_VERSION_CODE=$((180000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :core:test :mock-harness:test :app:testReleaseUnitTest --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Release lint
        run: ./gradlew :app:lintRelease --stacktrace

      - name: Verify release signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose "$APK"

      - name: Checksums
        run: |
          cd app/build/outputs/apk/release
          sha256sum *.apk > SHA256SUMS.txt
          ls -la

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          generate_release_notes: true
